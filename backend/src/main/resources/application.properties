# ---------------------------------------------------------
# Server
# ---------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------
# MySQL connection
# Configurable via environment variables for Railway/Render/Docker/VPS
# ---------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codebattle?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=SandeepgaadiSandeep
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------
# Jackson
# ---------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------
# CORS - comma-separated list of allowed origins or *
# ---------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---------------------------------------------------------
# JWT
# ---------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-any-real-deployment-32chars-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
